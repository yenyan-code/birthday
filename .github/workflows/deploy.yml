name: Dagan Bai Game CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify JavaScript Syntax
        run: |
          node --check src/js/engine.js
          node --check src/js/surprise.js
          node --check src/js/main.js

      - name: Verify Core Files Exist
        run: |
          test -f src/index.html
          test -f src/css/style.css
          test -f README.md
          test -f docs/architecture.md
          test -f docs/user-guide.md
          echo "All core files and syntax checks passed successfully!"
